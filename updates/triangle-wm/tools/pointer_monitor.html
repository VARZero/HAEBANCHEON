<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해반천 포인터 · 실제 HDMI</title>
<style>body{margin:20px;background:#15191e;color:#eee;font:15px system-ui}button{padding:10px 16px;margin:0 8px 10px 0}img{display:block;max-width:100%;width:1280px;touch-action:none;user-select:none}img.armed{cursor:none}#status{margin:12px 0}</style>
<h1>해반천 · 실제 보드 포인터</h1><button id="arm">포인터 입력 켜기</button><button id="cancel">드래그 취소</button><button id="stop">입력 연결 종료</button><label><input id="show-pointer" type="checkbox" checked disabled> 포인터 표시</label><div id="status">입력 꺼짐</div>
<div id="capture">캡처 상태 확인 중</div>
<label><input id="send-keys" type="checkbox"> 선택한 앱에 키보드 입력 보내기 · 예제는 ASCII 입력 지원</label>
<div style="margin:12px 0;display:flex;flex-wrap:wrap;gap:12px;align-items:center"><label>창 <select id="color-window"></select></label><label>S · 스플래시 <input type="color" id="splash-color" value="#ff2424"></label><label>B · 배경 <input type="color" id="background-color" value="#49b600"></label><button id="apply-colors" disabled>색 적용</button><span id="color-status"></span></div>
<img id="screen" src="http://127.0.0.1:8766/stream" tabindex="0" draggable="false" alt="실제 보드 HDMI 출력. 위쪽 닫기, 아래쪽 이동, 오른쪽 하단 크기 조절">
<p>이동은 기존 창을 유지하고 S색 삼각형 타일 한 개를 움직입니다. 크기 조절은 기존 콘텐츠를 숨기고 S색으로 채운 빈 창 전체를 키우고 줄입니다. 놓으면 B색 배경과 최신 콘텐츠를 함께 표시합니다. Esc는 취소합니다. 포인터 표시를 꺼도 창 조작은 유지됩니다. 색은 보드의 RGB332 색상으로 맞춰집니다.</p>
<script>
const screen=document.getElementById('screen'),status=document.getElementById('status'),arm=document.getElementById('arm'),showPointer=document.getElementById('show-pointer');let enabled=false,held=false,busy=false,queue=[];
let visibilityReady=false,asyncInput=false,fastInput=false,lastMoveAccept=null,acceptedTicket=0,visibleTicket=0;
const colorWindow=document.getElementById('color-window'),splashColor=document.getElementById('splash-color'),backgroundColor=document.getElementById('background-color'),applyColors=document.getElementById('apply-colors');let windowColors=[];
function rgb332(i){let r=Math.floor((i>>5)*255/7),g=Math.floor(((i>>2)&7)*255/7),b=(i&3)*85;if(((i>>2)&7)===(i>>5)&&(i&3)===(r>>6))g=b=r;return [r,b,g];}
function hex332(i){return '#'+rgb332(i).map(n=>n.toString(16).padStart(2,'0')).join('');}
function index332(hex){const n=parseInt(hex.slice(1),16),rgb=[n>>16,(n>>8)&255,n&255];let best=0,distance=Infinity;for(let i=0;i<256;i++){const c=rgb332(i),d=c.reduce((sum,v,k)=>sum+(v-rgb[k])**2,0);if(d<distance){distance=d;best=i;}}return best;}
function selectColors(){const w=windowColors.find(w=>String(w.window_id)===colorWindow.value);if(w){splashColor.value=hex332(w.splash_index);backgroundColor.value=hex332(w.background_index);}applyColors.disabled=!w||held;}
function updateColors(result){if(!result.window_colors)return;windowColors=result.window_colors;const previous=colorWindow.value;colorWindow.replaceChildren(...windowColors.map(w=>{const o=document.createElement('option');o.value=w.window_id;o.textContent='창 '+w.window_id;return o;}));if(windowColors.some(w=>String(w.window_id)===previous))colorWindow.value=previous;selectColors();}
colorWindow.onchange=selectColors;applyColors.onclick=()=>{const s=index332(splashColor.value),b=index332(backgroundColor.value);splashColor.value=hex332(s);backgroundColor.value=hex332(b);send('input_colors',{window_id:Number(colorWindow.value),splash_index:s,background_index:b});send('input_status');};
async function health(){try{const s=await(await fetch('/status',{cache:'no-store'})).json(),c=s.capture||{};asyncInput=!!s.async_input;fastInput=!!s.fast_input;document.getElementById('capture').textContent=c.capture_age_seconds===undefined?'캡처 연결 확인 필요':'실제 HDMI · 프레임 '+c.capture_sequence+' · '+c.capture_age_seconds+'초 전'+(c.capture_age_seconds>2?' · 영상 정지 확인 필요':'');if(s.online)arm.disabled=false;if(s.online&&!visibilityReady){visibilityReady=true;send('input_status');}if(!s.online){visibilityReady=false;enabled=false;held=false;queue=[];screen.classList.remove('armed');arm.disabled=true;showPointer.disabled=true;}}catch(e){document.getElementById('capture').textContent='모니터 연결 확인 필요';}setTimeout(health,2000);}health();
async function pump(){if(busy)return;busy=true;while(queue.length){const q=queue.shift();try{const r=await(await fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)})).json();if(r.ok&&r.result)updateColors(r.result);if(r.ok&&r.result&&typeof r.result.display_enabled==='boolean'){showPointer.checked=r.result.display_enabled;showPointer.disabled=false;}if(r.ok&&r.queued_to_uart){status.textContent='최신 좌표 전송 예약 '+r.result.queued_sequence+' · '+r.host_queue_ms.toFixed(1)+' ms · 실제 반응은 HDMI 화면에서 확인';}else if(r.ok&&(q.op==='input_text'||q.op==='input_key'||r.result?.action===4)){status.textContent='앱 입력 접수 '+r.accept_ms.toFixed(1)+' ms · 콘텐츠 반영 완료는 별도';}else if(r.ok&&r.result&&typeof r.result.accepted_ticket==='number'){const p=r.result;acceptedTicket=p.accepted_ticket;visibleTicket=p.visible_ticket;if(q.op==='input_move')lastMoveAccept=r.accept_ms;status.textContent=(lastMoveAccept===null?'표시 상태':('최근 좌표 수락 '+lastMoveAccept.toFixed(1)+' ms'))+' · 접수 '+p.accepted_ticket+' / 표시 '+p.visible_ticket+' · '+(p.last_accept_to_visible_us===undefined?'화면 완료는 별도 확인':('최근 표시 지연 '+(p.last_accept_to_visible_us/1000).toFixed(1)+' ms (보드 접수 후)'));}else status.textContent=r.ok?'수락 '+(r.accept_ms??r.present_ms).toFixed(1)+' ms · 첫 반응 '+(r.feedback_ms??r.present_ms).toFixed(1)+' ms · 게시 확인 '+r.present_ms.toFixed(1)+' ms · '+(held?'드래그 중':'입력 대기'):'오류: '+(r.error||'연결 확인');}catch(e){status.textContent='입력 연결 오류';enabled=false;queue=[];screen.classList.remove('armed');}}busy=false;}
function send(op,args={}){const q={op,args};if(op==='input_move'&&queue.length&&queue[queue.length-1].op==='input_move')queue[queue.length-1]=q;else if(op==='input_text'&&queue.length&&queue[queue.length-1].op==='input_text'&&queue[queue.length-1].args.text.length+args.text.length<=512)queue[queue.length-1].args.text+=args.text;else queue.push(q);pump();}
setInterval(()=>{if(asyncInput&&!fastInput&&enabled&&!busy&&!queue.length&&visibleTicket<acceptedTicket)send('input_progress');},500);
showPointer.onchange=()=>send('input_visibility',{visible:showPointer.checked});
function coords(e){const r=screen.getBoundingClientRect();return {x:Math.max(0,Math.min(1279,Math.round((e.clientX-r.left)*1280/r.width))),y:Math.max(0,Math.min(719,Math.round((e.clientY-r.top)*720/r.height)))};}
function cancel(){if(enabled||held)send('input_cancel');held=false;applyColors.disabled=!windowColors.length;}
arm.onclick=()=>{if(enabled)cancel();enabled=!enabled;arm.textContent=enabled?'포인터 입력 끄기':'포인터 입력 켜기';screen.classList.toggle('armed',enabled);status.textContent=enabled?'화면 위에서 마우스를 움직이세요':'입력 꺼짐';};
screen.onpointermove=e=>{if(enabled)send('input_move',coords(e));};
screen.onpointerdown=e=>{if(!enabled||e.button!==0)return;e.preventDefault();screen.focus({preventScroll:true});held=true;applyColors.disabled=true;screen.setPointerCapture(e.pointerId);send('input_button',{...coords(e),pressed:true});};
screen.onpointerup=e=>{if(!held)return;held=false;applyColors.disabled=false;send('input_button',{...coords(e),pressed:false});if(screen.hasPointerCapture(e.pointerId))screen.releasePointerCapture(e.pointerId);};
screen.onpointercancel=cancel;screen.onlostpointercapture=()=>{if(held)cancel();};window.onblur=cancel;window.onpagehide=()=>{if(enabled||held)navigator.sendBeacon('/input',new Blob([JSON.stringify({op:'input_cancel',args:{}})],{type:'application/json'}));};window.onkeydown=e=>{
 if(e.key==='Escape'){cancel();document.getElementById('send-keys').checked=false;return;}
 if(!enabled||held||!document.getElementById('send-keys').checked||e.isComposing||/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName))return;
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();send('input_key',{key:'Save'});return;}
 if(e.ctrlKey&&!e.metaKey&&!e.altKey&&['c','d','l'].includes(e.key.toLowerCase())){e.preventDefault();send('input_key',{key:{c:'Interrupt',d:'EOF',l:'ClearScreen'}[e.key.toLowerCase()]});return;}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(['Backspace','Delete','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Enter','Tab','PageUp','PageDown'].includes(e.key)){e.preventDefault();send('input_key',{key:e.key});}
 else if(e.key.length===1&&e.key.charCodeAt(0)>=32&&e.key.charCodeAt(0)<=126){e.preventDefault();send('input_text',{text:e.key});}
};document.getElementById('cancel').onclick=cancel;
document.getElementById('stop').onclick=async()=>{cancel();enabled=false;screen.classList.remove('armed');queue=[];while(busy)await new Promise(r=>setTimeout(r,50));await fetch('/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});status.textContent='입력 연결 종료 · UART 콘솔 복원';arm.disabled=true;showPointer.disabled=true;};
</script></html>
