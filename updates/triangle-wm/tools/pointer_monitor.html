<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해반천 포인터 · 실제 HDMI</title>
<style>body{margin:20px;background:#15191e;color:#eee;font:15px system-ui}button{padding:10px 16px;margin:0 8px 10px 0}img{display:block;max-width:100%;width:1280px;touch-action:none;user-select:none}img.armed{cursor:none}#status{margin:12px 0}</style>
<h1>해반천 · 실제 보드 포인터</h1><button id="arm">포인터 입력 켜기</button><button id="cancel">드래그 취소</button><button id="stop">입력 연결 종료</button><div id="status">입력 꺼짐</div>
<div id="capture">캡처 상태 확인 중</div>
<img id="screen" src="http://127.0.0.1:8766/stream" draggable="false" alt="실제 보드 HDMI 출력. 위쪽 닫기, 아래쪽 이동, 오른쪽 하단 크기 조절">
<p>드래그 중에는 닷이 이동하며, 놓으면 창 위치·크기가 확정됩니다. Esc는 취소합니다. 표시 지연은 소프트웨어 합성 경로의 실측값입니다.</p>
<script>
const screen=document.getElementById('screen'),status=document.getElementById('status'),arm=document.getElementById('arm');let enabled=false,held=false,busy=false,queue=[];
async function health(){try{const s=await(await fetch('/status',{cache:'no-store'})).json(),c=s.capture||{};document.getElementById('capture').textContent=c.capture_age_seconds===undefined?'캡처 연결 확인 필요':'실제 HDMI · 프레임 '+c.capture_sequence+' · '+c.capture_age_seconds+'초 전'+(c.capture_age_seconds>2?' · 영상 정지 확인 필요':'');if(!s.online){enabled=false;held=false;queue=[];screen.classList.remove('armed');arm.disabled=true;}}catch(e){document.getElementById('capture').textContent='모니터 연결 확인 필요';}setTimeout(health,2000);}health();
async function pump(){if(busy)return;busy=true;while(queue.length){const q=queue.shift();try{const r=await(await fetch('/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)})).json();status.textContent=r.ok?'보드 완료 '+r.present_ms.toFixed(1)+' ms · '+(held?'드래그 중':'입력 대기'):'오류: '+(r.error||'연결 확인');}catch(e){status.textContent='입력 연결 오류';enabled=false;queue=[];screen.classList.remove('armed');}}busy=false;}
function send(op,args={}){const q={op,args};if(op==='input_move'&&queue.length&&queue[queue.length-1].op==='input_move')queue[queue.length-1]=q;else queue.push(q);pump();}
function coords(e){const r=screen.getBoundingClientRect();return {x:Math.max(0,Math.min(1279,Math.round((e.clientX-r.left)*1280/r.width))),y:Math.max(0,Math.min(719,Math.round((e.clientY-r.top)*720/r.height)))};}
function cancel(){if(enabled||held)send('input_cancel');held=false;}
arm.onclick=()=>{if(enabled)cancel();enabled=!enabled;arm.textContent=enabled?'포인터 입력 끄기':'포인터 입력 켜기';screen.classList.toggle('armed',enabled);status.textContent=enabled?'화면 위에서 마우스를 움직이세요':'입력 꺼짐';};
screen.onpointermove=e=>{if(enabled)send('input_move',coords(e));};
screen.onpointerdown=e=>{if(!enabled||e.button!==0)return;e.preventDefault();held=true;screen.setPointerCapture(e.pointerId);send('input_button',{...coords(e),pressed:true});};
screen.onpointerup=e=>{if(!held)return;held=false;send('input_button',{...coords(e),pressed:false});if(screen.hasPointerCapture(e.pointerId))screen.releasePointerCapture(e.pointerId);};
screen.onpointercancel=cancel;screen.onlostpointercapture=()=>{if(held)cancel();};window.onblur=cancel;window.onpagehide=()=>{if(enabled||held)navigator.sendBeacon('/input',new Blob([JSON.stringify({op:'input_cancel',args:{}})],{type:'application/json'}));};window.onkeydown=e=>{if(e.key==='Escape')cancel();};document.getElementById('cancel').onclick=cancel;
document.getElementById('stop').onclick=async()=>{cancel();enabled=false;screen.classList.remove('armed');queue=[];while(busy)await new Promise(r=>setTimeout(r,50));await fetch('/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});status.textContent='입력 연결 종료 · UART 콘솔 복원';arm.disabled=true;};
</script></html>
