<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해반천 · 콘솔과 HDMI</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c1119;color:#e8eef7}*{box-sizing:border-box}body{margin:0;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}h1{font-size:21px;margin:0}small{color:#98a8bd}.panels{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);gap:16px}.panel{border:1px solid #29384d;border-radius:12px;background:#111b29;overflow:hidden}.bar{padding:12px 16px;background:#162235;display:flex;justify-content:space-between;gap:12px}#screen{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:black}#console{height:490px;overflow:auto;margin:0;padding:14px;font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all;background:#080f18}.tx{color:#7dd3fc}.rx{color:#d3e7d6}.info{color:#a9b9cc}.error{color:#ffa7a7}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 14px}button,input{font:inherit;border-radius:7px;border:1px solid #384c68;padding:9px 13px;color:inherit;background:#20334c}button{cursor:pointer}button:hover{background:#2f4b6c}button:disabled{opacity:.4;cursor:default}button.primary{background:#075c8a}#command{flex:1;min-width:160px;background:#0c1522}form{display:flex;gap:8px;padding:12px;border-top:1px solid #29384d}.ok{color:#71dfb1}.warn{color:#ffd27c}#notice{padding:0 14px 12px;color:#b0bfd1;font-size:13px}.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px}.pad button{padding:10px}.pad .up{grid-column:2}.pad .left{grid-row:2;grid-column:1}.pad .down{grid-row:2;grid-column:2}.pad .right{grid-row:2;grid-column:3}.foot{margin-top:14px;color:#98a8bd;font-size:12px}@media(max-width:1000px){.panels{grid-template-columns:1fr}#console{height:340px}}
</style>
<header><div><h1>해반천 · 실제 보드</h1><small>USB HDMI 캡처와 UART 콘솔</small></div><span id="connection">연결 확인 중</span></header>
<main class="panels">
<section class="panel"><div class="bar"><strong>HDMI</strong><span id="video-status">캡처 대기</span></div><img id="screen" src="/stream" alt="보드 HDMI 실시간 캡처"><div class="controls"><button id="start" class="primary">TTY 키 입력 시작</button><button id="stop">Ctrl+C · 콘솔 복귀</button><button data-key="Home">Home · 홈 화면</button><button data-key="Enter">Enter · 선택</button><div class="pad"><button class="up" data-key="ArrowUp">↑</button><button class="left" data-key="ArrowLeft">←</button><button class="down" data-key="ArrowDown">↓</button><button class="right" data-key="ArrowRight">→</button></div></div><div id="notice">입력을 시작하면 Home·방향키·Enter를 실제 UART로 보냅니다.</div></section>
<section class="panel"><div class="bar"><strong>UART 콘솔 · COM4 / 115200</strong><label><input id="follow" type="checkbox" checked> 따라가기</label></div><div id="console" role="log" aria-live="polite"></div><form id="command-form"><input id="command" aria-label="보드 콘솔 명령" placeholder="보드에서 실행할 명령" autocomplete="off"><button id="send">실행</button></form></section>
</main><div class="foot">파란 줄은 보낸 명령·키, 나머지는 실제 보드 출력입니다. HDMI는 캡처보드의 지연을 포함합니다.</div>
<script>
const consoleView=document.getElementById('console'),command=document.getElementById('command'),notice=document.getElementById('notice');let after=0,mode='shell',sending=false;
document.getElementById('screen').onerror=()=>setTimeout(()=>{document.getElementById('screen').src='/stream?reconnect='+Date.now();},1000);
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok||result.error)throw Error(result.error||r.statusText);return result;}
async function action(path,data){try{return await post(path,data);}catch(e){notice.textContent=e.message;}}
document.getElementById('start').onclick=()=>action('/tty',{enabled:true});document.getElementById('stop').onclick=()=>action('/tty',{enabled:false});
document.querySelectorAll('[data-key]').forEach(button=>button.onclick=()=>action('/key',{key:button.dataset.key}));
document.addEventListener('keydown',event=>{if(mode!=='tty'||['INPUT','TEXTAREA'].includes(event.target.tagName))return;if(['Home','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(event.key)){event.preventDefault();if(event.repeat&&['Home','Enter'].includes(event.key))return;action('/key',{key:event.key});}});
document.getElementById('command-form').onsubmit=async event=>{event.preventDefault();if(sending||mode!=='shell'||!command.value.trim())return;sending=true;const text=command.value;command.value='';try{const r=await post('/command',{command:text,timeout:120});notice.textContent='명령 종료: '+r.rc+' · 콘솔 왕복 '+r.host_ms+' ms';}catch(e){notice.textContent=e.message;}finally{sending=false;}};
async function refresh(){try{const r=await fetch('/status?after='+after,{cache:'no-store'});const s=await r.json();mode=s.mode;if(s.last_event_id<after){after=0;setTimeout(refresh,0);return;}for(const event of s.events){const row=document.createElement('div');row.className=event.kind;row.textContent=event.kind==='rx'?event.text:'['+event.time+'] '+(event.kind==='tx'?'보냄 › ':'')+event.text;consoleView.append(row);after=event.id;}while(consoleView.childNodes.length>1600)consoleView.firstChild.remove();if(document.getElementById('follow').checked)consoleView.scrollTop=consoleView.scrollHeight;
document.getElementById('connection').textContent=mode==='tty'?'● TTY 키 입력 중':mode==='starting'?'입력 앱 시작 중':mode==='stopping'?'콘솔 복귀 중':'● 콘솔 연결됨';document.getElementById('connection').className='ok';document.getElementById('video-status').textContent=s.capture_age_ms===null?'캡처 대기':s.capture_age_ms>2000?'캡처 중단':s.nonblack_pixels<100?'캡처 수신 중 · 검은 화면':'실시간 · '+s.capture_sequence+'프레임';document.getElementById('video-status').className=s.nonblack_pixels<100?'warn':'ok';document.getElementById('start').disabled=mode!=='shell';document.querySelectorAll('[data-key]').forEach(b=>b.disabled=mode!=='tty');command.disabled=mode!=='shell';document.getElementById('send').disabled=sending||mode!=='shell';}catch(e){document.getElementById('connection').textContent='연결 끊김';}setTimeout(refresh,250);}refresh();
</script></html>
